<style>
:root{
  --bg:#1a1330; --bg2:#241a3d; --card:#2a1f45;
  --gold:#e8b64c; --pink:#ff6f9c; --lav:#f0e8ff; --dim:#b8a9d9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--lav); font-family:'Heebo',sans-serif; min-height:100%;
  display:flex; flex-direction:column;
}
header{padding:18px 20px 6px; text-align:center;}
header h1{
  font-family:'Literata',serif; font-weight:600; font-size:1.5rem;
  margin:0 0 4px; color:var(--gold); letter-spacing:.3px;
}
header p{margin:0; color:var(--dim); font-size:.9rem;}

nav.tabs{
  display:flex; gap:6px; max-width:640px; margin:14px auto 0; padding:0 16px; width:100%;
}
.tab{
  flex:1; text-align:center; padding:10px 0; border-radius:12px 12px 0 0; cursor:pointer;
  font-size:.9rem; color:var(--dim); background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-bottom:none;
}
.tab.active{background:var(--card); color:var(--gold); font-weight:600;}

main{flex:1; padding:0 16px 40px; max-width:640px; margin:0 auto; width:100%;}
.page{display:none;}
.page.show{display:block;}

.setup{
  background:var(--card); border-radius:0 0 18px 18px; padding:18px;
  border:1px solid rgba(232,182,76,.15); border-top:none;
}
.setup label{display:block; font-size:.85rem; color:var(--dim); margin-bottom:8px;}
.chips{max-height:210px; overflow-y:auto; display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.chip{
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
  color:var(--lav); padding:8px 14px; border-radius:999px; font-size:.85rem;
  cursor:pointer; transition:.15s;
}
.chip.active{background:var(--pink); border-color:var(--pink); color:#1a1330; font-weight:600;}
.chip.hist{border-color:rgba(232,182,76,.4);}
.custom-row{display:flex; gap:8px; margin-bottom:14px;}
input[type=text]{
  flex:1; background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.12);
  border-radius:12px; padding:11px 14px; color:var(--lav); font-size:.9rem; font-family:inherit;
}
input[type=text]::placeholder{color:var(--dim);}
.levels{display:flex; gap:8px; margin-bottom:16px;}
.level{
  flex:1; text-align:center; padding:9px 0; border-radius:10px; font-size:.82rem;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); cursor:pointer;
}
.level.active{background:rgba(255,111,156,.25); border-color:var(--pink); color:var(--pink); font-weight:600;}
button.go{
  width:100%; padding:13px; border:none; border-radius:12px; font-size:1rem; font-weight:700;
  background:linear-gradient(90deg,var(--gold),var(--pink)); color:#1a1330; cursor:pointer;
  font-family:'Heebo',sans-serif;
}
button.go:disabled{opacity:.5;}

.reading{
  background:var(--card); border-radius:18px; padding:22px 20px; margin-top:18px;
  border:1px solid rgba(232,182,76,.15); display:none; position:relative;
}
.reading.show{display:block;}
.reading h2{
  font-family:'Literata',serif; color:var(--gold); font-size:1.15rem; margin:0 0 14px;
  direction:ltr; text-align:left;
}
.passage{white-space:pre-line;
  font-family:'Literata',serif; font-size:1.08rem; line-height:1.85; color:var(--lav);
  direction:ltr; text-align:left;
}
.word{cursor:pointer; border-bottom:1px dashed rgba(232,182,76,.4); transition:.12s;}
.word:hover, .word:active{background:rgba(255,111,156,.25); border-bottom-color:var(--pink);}
.word.saved{border-bottom:1px solid var(--gold); background:rgba(232,182,76,.12);}
.newtopic{
  margin-top:16px; background:none; border:1px solid rgba(255,255,255,.15); color:var(--dim);
  padding:10px 16px; border-radius:10px; font-family:inherit; font-size:.85rem; cursor:pointer;
}

.loading{text-align:center; color:var(--dim); padding:30px 0; display:none;}
.loading.show{display:block;}
.spin{
  width:26px; height:26px; margin:0 auto 10px; border-radius:50%;
  border:3px solid rgba(255,255,255,.15); border-top-color:var(--pink);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.popup{
  position:fixed; z-index:50; max-width:280px;
  background:linear-gradient(160deg,#3a2a5c,#2a1f45); border:1px solid var(--gold);
  border-radius:14px; padding:14px 16px; box-shadow:0 10px 30px rgba(0,0,0,.5);
  direction:rtl; font-size:1rem; display:none; animation:pop .15s ease-out;
}
.popup.show{display:block;}
@keyframes pop{from{opacity:0; transform:translateY(6px) scale(.96);} to{opacity:1; transform:none;}}
.popup .en{color:var(--gold); font-family:'Literata',serif; direction:ltr; text-align:left; font-size:.95rem; margin-bottom:6px;}
.popup .he{color:var(--lav); font-weight:700; font-size:1.15rem; margin-bottom:10px;}
.popup .close{position:absolute; top:6px; left:10px; color:var(--dim); cursor:pointer; font-size:1.1rem;}
.popup .save-btn{
  width:100%; padding:8px; border-radius:9px; border:1px solid var(--gold); background:none;
  color:var(--gold); font-family:inherit; font-size:.85rem; cursor:pointer;
}
.popup .save-btn.saved{background:var(--gold); color:#1a1330; font-weight:700;}
.overlay{position:fixed; inset:0; z-index:40; display:none;}
.overlay.show{display:block;}

.words-list{background:var(--card); border-radius:18px; padding:8px; border:1px solid rgba(232,182,76,.15); margin-top:14px;}
.word-row{
  display:flex; justify-content:space-between; align-items:center; padding:13px 14px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.word-row:last-child{border-bottom:none;}
.word-row .wtext{font-family:'Literata',serif; direction:ltr; text-align:left;}
.word-row .wtext .en{color:var(--gold); font-size:1rem;}
.word-row .wtext .he{color:var(--dim); font-size:.85rem; direction:rtl; text-align:right; margin-top:2px;}
.word-row .del{color:var(--dim); cursor:pointer; font-size:1.1rem; padding:4px 8px;}
.empty{text-align:center; color:var(--dim); padding:36px 20px; font-size:.9rem;}
</style>
</head>
<body>
<header>
  <h1>קריאה באנגלית 📖</h1>
  <p>בחר נושא, קרא, ולחץ על כל מילה שלא מכירים</p>
</header>

<nav class="tabs">
  <div class="tab active" data-tab="read">קריאה</div>
  <div class="tab" data-tab="words">המילים שלי</div>
</nav>

<main>
  <div class="page show" id="page-read">
    <div class="setup" id="setup">
      <label id="histLabel" style="display:none;">נושאים אחרונים</label>
      <div class="chips" id="histChips"></div>
      <label>נושא לקריאה</label>
      <div class="chips" id="chips"></div>
      <div class="custom-row">
        <input type="text" id="customTopic" placeholder="או כתוב נושא משלך...">
      </div>
      <label>רמת קושי</label>
      <div class="levels" id="levels">
        <div class="level" data-lvl="easy">קל</div>
        <div class="level active" data-lvl="medium">בינוני</div>
        <div class="level" data-lvl="hard">מתקדם</div>
      </div>
      <button class="go" id="goBtn">צור טקסט לקריאה</button>
    </div>

    <div class="loading" id="loading">
      <div class="spin"></div>
      <div id="loadingText">מכין טקסט...</div>
    </div>

    <div class="reading" id="reading">
      <h2 id="readingTitle"></h2>
      <div class="passage" id="passage"></div>
      <button class="newtopic" id="moreBtn">📄 טקסט נוסף על הנושא</button>
      <button class="newtopic" id="newTopicBtn">נושא חדש</button>
    </div>
  </div>

  <div class="page" id="page-words">
    <div class="words-list" id="wordsList"></div>
  </div>
</main>

<div class="overlay" id="overlay"></div>
<div class="popup" id="popup">
  <span class="close" id="popupClose">✕</span>
  <div class="en" id="popupEn"></div>
  <div class="he" id="popupHe">...</div>
  <button class="save-btn" id="saveBtn">⭐ שמור מילה ללימוד</button>
</div>

<script>
const TOPIC_EN={"חלל": "space exploration", "מערכת השמש": "solar system", "היסטוריה": "ancient history", "מלחמת העולם השנייה": "World War II", "טכנולוגיה": "technology", "בינה מלאכותית": "artificial intelligence", "ספורט": "sport", "כדורגל": "association football", "טבע": "nature", "חיות": "animals", "אוקיינוס": "ocean", "דינוזאורים": "dinosaurs", "בישול": "cooking", "פסיכולוגיה": "psychology", "סרטים": "cinema", "מוזיקה": "music", "מדע": "science", "גוף האדם": "human body", "בריאות": "health", "כלכלה": "economics", "השקעות": "investing", "עסקים": "business", "מדינות": "country", "ערים": "city", "טיולים": "tourism", "מכוניות": "automobile", "מטוסים": "aircraft", "משחקי וידאו": "video game", "אמנות": "art", "ספרות": "literature", "פילוסופיה": "philosophy", "דתות": "religion", "אנשים מפורסמים": "inventor", "אקלים": "climate", "אנרגיה": "energy"};
const TOPICS = Object.keys(TOPIC_EN);
let selectedTopic = null, selectedLevel = 'medium', sample = null;
const translationCache = {};
let currentWord = null, currentHe = '';

// ---- storage helpers ----
function loadHistory(){ try{ return JSON.parse(localStorage.getItem('rea_history')||'[]'); }catch(e){ return []; } }
function saveHistory(list){ try{ localStorage.setItem('rea_history', JSON.stringify(list)); }catch(e){} }
function addHistory(topic, level){
  let hist = loadHistory().filter(h=>h.topic!==topic);
  hist.unshift({topic, level, date: Date.now()});
  hist = hist.slice(0,6);
  saveHistory(hist);
  renderHistoryChips();
}
function loadWords(){ try{ return JSON.parse(localStorage.getItem('rea_words')||'[]'); }catch(e){ return []; } }
function saveWords(list){ try{ localStorage.setItem('rea_words', JSON.stringify(list)); }catch(e){} }
function isWordSaved(word){ return loadWords().some(w=>w.en.toLowerCase()===word.toLowerCase()); }
function addWord(en, he){
  const list = loadWords();
  if(list.some(w=>w.en.toLowerCase()===en.toLowerCase())) return;
  list.unshift({en, he, date: Date.now()});
  saveWords(list);
}
function removeWord(en){
  saveWords(loadWords().filter(w=>w.en.toLowerCase()!==en.toLowerCase()));
}

function renderHistoryChips(){
  const hist = loadHistory();
  const wrap = document.getElementById('histChips');
  const label = document.getElementById('histLabel');
  wrap.innerHTML = '';
  if(hist.length===0){ label.style.display='none'; return; }
  label.style.display='block';
  hist.forEach(h=>{
    const c = document.createElement('div');
    c.className='chip hist'; c.textContent=h.topic;
    c.onclick=()=>{
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active'); selectedTopic=h.topic;
      document.getElementById('customTopic').value='';
      document.querySelectorAll('.level').forEach(x=>x.classList.toggle('active', x.dataset.lvl===h.level));
      selectedLevel = h.level;
    };
    wrap.appendChild(c);
  });
}

const chipsEl = document.getElementById('chips');
TOPICS.forEach(t=>{
  const c = document.createElement('div');
  c.className='chip'; c.textContent=t;
  c.onclick=()=>{ document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active'); selectedTopic=t; document.getElementById('customTopic').value=''; };
  chipsEl.appendChild(c);
});
document.getElementById('customTopic').addEventListener('input', e=>{
  if(e.target.value.trim()){ document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); selectedTopic=null; }
});
document.querySelectorAll('.level').forEach(l=>{
  l.onclick=()=>{ document.querySelectorAll('.level').forEach(x=>x.classList.remove('active')); l.classList.add('active'); selectedLevel=l.dataset.lvl; };
});

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));
    t.classList.add('active');
    document.getElementById('page-'+t.dataset.tab).classList.add('show');
    if(t.dataset.tab==='words') renderWordsList();
  };
});

function renderWordsList(){
  const list = loadWords();
  const el = document.getElementById('wordsList');
  if(list.length===0){
    el.innerHTML = '<div class="empty">עוד לא שמרת מילים. בזמן קריאה, לחץ על מילה ואז על "שמור מילה ללימוד".</div>';
    return;
  }
  el.innerHTML = '';
  list.forEach(w=>{
    const row = document.createElement('div');
    row.className='word-row';
    row.innerHTML = `<div class="wtext"><div class="en">${w.en}</div><div class="he">${w.he}</div></div><span class="del">🗑️</span>`;
    row.querySelector('.del').onclick=()=>{ removeWord(w.en); renderWordsList(); };
    el.appendChild(row);
  });
}

renderHistoryChips();

async function tr(text,pair){
  const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+pair);
  const d=await r.json(); return d.responseData.translatedText;
}
let lastTopic=null;
async function generate(topic){
  lastTopic=topic;
  document.getElementById('setup').style.display='none';
  document.getElementById('reading').classList.remove('show');
  document.getElementById('loadingText').textContent='מחפש טקסט על '+topic+'...';
  document.getElementById('loading').classList.add('show');
  try{
    let q = TOPIC_EN[topic] || topic;
    if(/[\u0590-\u05FF]/.test(q)) q = await tr(q,'he|en');
    const host = selectedLevel==='easy' ? 'simple' : 'en';
    const len = {easy:900, medium:1300, hard:1800}[selectedLevel];
    let pool=[];
    for(let i=0;i<2 && !pool.length;i++){
      const off = i===0 ? Math.floor(Math.random()*40) : 0;
      const url = `https://${host}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=10&gsroffset=${off}&prop=extracts&exintro=1&explaintext=1&exchars=${len}&format=json&origin=*`;
      const d = await (await fetch(url)).json();
      if(d.query) pool = Object.values(d.query.pages).filter(p=>p.extract && p.extract.length>250);
    }
    const p = pool[Math.floor(Math.random()*pool.length)];
    renderPassage(p.title, p.extract.trim());
    addHistory(topic, selectedLevel);
  }catch(e){
    document.getElementById('loading').classList.remove('show');
    document.getElementById('setup').style.display='block';
    alert('לא נמצא טקסט, נסה נושא אחר');
  }
}
document.getElementById('goBtn').onclick = ()=>{
  const topic = document.getElementById('customTopic').value.trim() || selectedTopic;
  if(!topic){ alert('בחר או כתוב נושא'); return; }
  generate(topic);
};
document.getElementById('moreBtn').onclick = ()=>generate(lastTopic);

function renderPassage(title, text){
  document.getElementById('loading').classList.remove('show');
  document.getElementById('readingTitle').textContent = title;
  const passageEl = document.getElementById('passage');
  passageEl.innerHTML = '';
  const tokens = text.split(/(\s+)/);
  tokens.forEach(tok=>{
    if(/^\s+$/.test(tok) || tok===''){ passageEl.appendChild(document.createTextNode(tok)); return; }
    const clean = tok.replace(/[^\w'-]/g,'');
    if(!clean){ passageEl.appendChild(document.createTextNode(tok)); return; }
    const span = document.createElement('span');
    span.className='word'+(isWordSaved(clean)?' saved':''); span.textContent=tok; span.dataset.word=clean;
    span.onclick=(e)=>showTranslation(clean, text, e.target);
    passageEl.appendChild(span);
  });
  document.getElementById('reading').classList.add('show');
}

async function showTranslation(word, context, target){
  const popup = document.getElementById('popup');
  const overlay = document.getElementById('overlay');
  const rect = target.getBoundingClientRect();
  let top = rect.bottom + 8, left = rect.left;
  popup.style.top = Math.min(top, window.innerHeight-190)+'px';
  popup.style.left = Math.max(10, Math.min(left, window.innerWidth-300))+'px';
  document.getElementById('popupEn').textContent = word;
  document.getElementById('popupHe').textContent = '...';
  currentWord = word; currentHe = '';
  updateSaveBtn();
  popup.classList.add('show'); overlay.classList.add('show');

  const key = word.toLowerCase();
  if(translationCache[key]){
    currentHe = translationCache[key];
    document.getElementById('popupHe').textContent = currentHe;
    return;
  }
  try{
    const he = await tr(word,'en|he');
    translationCache[key] = he;
    currentHe = he;
    document.getElementById('popupHe').textContent = he;
  }catch(e){
    document.getElementById('popupHe').textContent = 'שגיאה בתרגום';
  }
}

function updateSaveBtn(){
  const btn = document.getElementById('saveBtn');
  if(currentWord && isWordSaved(currentWord)){
    btn.textContent='✓ נשמר ברשימת המילים'; btn.classList.add('saved');
  }else{
    btn.textContent='⭐ שמור מילה ללימוד'; btn.classList.remove('saved');
  }
}

document.getElementById('saveBtn').onclick = ()=>{
  if(!currentWord) return;
  if(isWordSaved(currentWord)){ removeWord(currentWord); }
  else{ addWord(currentWord, currentHe || document.getElementById('popupHe').textContent); }
  updateSaveBtn();
  document.querySelectorAll('.word').forEach(w=>{
    if(w.dataset.word && w.dataset.word.toLowerCase()===currentWord.toLowerCase()){
      w.classList.toggle('saved', isWordSaved(currentWord));
    }
  });
};

document.getElementById('popupClose').onclick = closePopup;
document.getElementById('overlay').onclick = closePopup;
function closePopup(){
  document.getElementById('popup').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

document.getElementById('newTopicBtn').onclick = ()=>{
  document.getElementById('reading').classList.remove('show');
  document.getElementById('setup').style.display='block';
};
</script>
